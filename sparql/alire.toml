name = "flyology_sparql"
description = "SPARQL 1.1 query parsing and serialization"
version = "0.1.0-dev"
licenses = "MIT OR Apache-2.0"
authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
website = "https://rdf.flyology.org/"
project-files = ["flyology_sparql.gpr"]
tags = ["ada", "rdf", "sparql", "query", "parser"]

[[depends-on]]
flyology_rdf = "*"

[[pins]]
flyology_rdf = { path = ".." }

[build-switches]
