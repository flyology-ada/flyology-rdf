name = "flyology_rdf_tests"
description = "Test programs for flyology_rdf"
version = "0.1.0-dev"
licenses = "MIT OR Apache-2.0"
authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
executables = [
  "iri_strictness_gate",
  "terms_tests",
  "statement_tests",
  "cursor_tests",
  "lexer_tests",
  "parser_tests",
  "serialization_tests",
  "roundtrip_tests",
  "canonicalization_tests",
  "codec_tests",
  "conformance",
  "canonicalization_conformance",
  "oracle_differential",
]

[[depends-on]]
flyology_rdf = "*"
#  The differential drives Fuseki over HTTP rather than starting a JVM for
#  every document. This is a test dependency only: the library itself keeps
#  no runtime dependency and no tasking.
flyology_http = ">=0.1.1-dev & <0.2.0"

[[pins]]
flyology_rdf = { path = ".." }
